task_name: task_5-2
task_type: markovian
event_type: ire

sources_and_signals:
  input_name: &input_keys
    - [summary, ip]
    - [interferometer, n_e_line]
    - [spectrometer_visible, filter_spectrometer_dalpha_voltage]
    - [soft_x_rays, horizontal_cam_upper]  # 18-channel signal; sxr_core/sxr_edge are channels within it
  actuator_name: []
  output_name: *input_keys  # dummy/unused: only present so the shared windowing engine has a non-empty output

task_window_segmenter:
  input_keys: *input_keys
  actuator_keys: []
  output_keys: *input_keys
  input_length: 0.010  # 10 ms window
  output_length: 0.010  # mirrors input_length, unused
  delta: 0

stride_window: 0.005  # 5 ms

classification:
  labels_file: classification_labels/ires.json
  label_name: IRES
  labelling_rule: center_in_interval  # a window is positive if its centre falls inside an annotated interval
  ip_signal: summary-ip
  ip_threshold_ka: 100
  flattop_min_frac: 0.5
  disruption_clip_s: 0.05  # windows within 50 ms before the shot's disruption time are excluded
  channel_selection:
    soft_x_rays-horizontal_cam_upper:
      sxr_core: 0
    spectrometer_visible-filter_spectrometer_dalpha_voltage:  # 3-channel signal; use the final channel
      dalpha: 2
